[build]
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
    "-C", "link-arg=-z",
    "-C", "link-arg=execstack",
    "-C", "link-arg=-m",
    "-C", "link-arg=elf_x86_64",
    "-C", "link-arg=--no-pie",
]
