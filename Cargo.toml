[package]
name = "malinka"
version = "0.1.0"
edition = "2021"

[dependencies]
x86_64 = "0.15.2"
spin = "0.9.8"
heapless = "0.7.16"
limine = "0.6.5"
volatile = "0.6.1"
linked_list_allocator = "0.10"

# Rhai (no_std, встроенный скриптовый движок)
rhai = { version = "1.25.1", default-features = false, features = ["no_std"] }

[[bin]]
name = "malinka"
path = "src/main.rs"

# Фичи сборки:
#   fb   (по умолчанию) — Limine запрашивает framebuffer, вывод на экран
#   no-fb — сборка БЕЗ framebuffer: только текстовый VGA 80x25 + serial.
#          Нужен для Bochs term-дисплея (ncurses), который не поддерживает
#          графический 32bpp-режим ("32 bpp graphics mode not supported").
#          Запуск: cargo build --release --no-default-features
[features]
default = ["fb"]
fb = []
no-fb = []

[profile.release]
lto = true
