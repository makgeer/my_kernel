[package]
name = "smart-term"
version = "0.1.0"
edition = "2021"
authors = ["makgeer"]
description = "Кроссплатформенный терминал с псевдографикой"
license = "MIT"

[dependencies]
crossterm = "0.26"
dirs = "5.0"
better-panic = "0.3"
whoami = "1.4"
serde_json = "1.0"
chrono = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "fileapi", "minwindef"] }

[profile.release]
opt-level = 3
debug = false
strip = true
